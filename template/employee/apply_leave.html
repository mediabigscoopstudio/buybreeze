<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Leave | CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand bg-white border-bottom shadow-sm sticky-top px-2 px-md-4 py-2">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-dark d-flex align-items-center gap-2" href="/">
                <div class="bg-success text-white rounded p-1 d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
                    <i class="bi bi-person-workspace"></i>
                </div>
                <span class="d-none d-sm-inline">Employee Portal</span>
            </a>
            <ul class="navbar-nav ms-auto align-items-center gap-2">
                <li class="nav-item">
                    <a class="nav-link text-dark fw-medium" href="/my-leaves/"><i class="bi bi-calendar-check me-1"></i>My Leaves</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-dark fw-medium" href="/apply-leave/"><i class="bi bi-calendar-plus me-1"></i>Apply Leave</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-danger fw-medium" href="/logout/"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container py-5" style="max-width: 640px;">

        <div class="d-flex align-items-center gap-3 mb-4">
            <a href="/my-leaves/" class="btn btn-outline-secondary btn-sm rounded-pill">
                <i class="bi bi-arrow-left me-1"></i> My Leaves
            </a>
            <div>
                <h4 class="fw-bold text-dark mb-0">Apply for Leave</h4>
                <div class="text-muted small">Submit a new leave request</div>
            </div>
        </div>

        {% if messages %}
        {% for msg in messages %}
        <div class="alert alert-{{ msg.tags|default:'info' }} alert-dismissible fade show rounded-3" role="alert">
            {{ msg }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        {% endif %}

        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small text-uppercase">Leave Type</label>
                        <select name="leave_type" class="form-select shadow-none" required>
                            <option value="" disabled selected>Select leave type…</option>
                            {% for val, label in leave_type_choices %}
                            <option value="{{ val }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-secondary small text-uppercase">From Date</label>
                            <input type="date" name="from_date" class="form-control shadow-none" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-secondary small text-uppercase">To Date</label>
                            <input type="date" name="to_date" class="form-control shadow-none" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold text-secondary small text-uppercase">Reason</label>
                        <textarea name="reason" class="form-control shadow-none" rows="4"
                                  placeholder="Briefly explain the reason for your leave…" required></textarea>
                    </div>

                    <div class="d-grid gap-2 d-sm-flex justify-content-sm-end">
                        <a href="/my-leaves/" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                        <button type="submit" class="btn btn-success rounded-pill px-4 fw-semibold">
                            <i class="bi bi-send me-1"></i> Submit Request
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Ensure to_date >= from_date
        const fromDate = document.querySelector('[name="from_date"]');
        const toDate   = document.querySelector('[name="to_date"]');
        fromDate.addEventListener('change', () => { toDate.min = fromDate.value; });
    </script>
</body>
</html>
