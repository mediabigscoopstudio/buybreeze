<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoreCRM — HR Authentication</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>

    <style>
        :root {
            --brand-bg: #f7f3f0;
            --brand-ink: #2E2E2E;
            --brand-accent: #6F8F9F;
            --sage: #4f7942;
            --sage-lt: #dce7d9;
            --white: #ffffff;
            --border: rgba(111, 143, 159, 0.2);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--brand-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 420px;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 48px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.025);
        }

        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--sage-lt);
            color: var(--sage);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 24px;
        }

        .card-title {
            font-size: 26px;
            font-weight: 700;
            color: var(--brand-ink);
            margin: 0 0 6px 0;
            letter-spacing: -0.5px;
        }

        .card-subtitle {
            font-size: 14px;
            color: var(--brand-accent);
            margin-bottom: 32px;
        }

        .grove-field {
            margin-bottom: 24px;
        }
        
        .grove-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--brand-accent);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-icon-wrap {
            position: relative;
        }

        .input-icon-wrap i {
            position: absolute;
            top: 50%;
            left: 16px;
            transform: translateY(-50%);
            color: var(--brand-accent);
            font-size: 16px;
        }

        .grove-input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px 14px 44px;
            font-size: 14px;
            color: var(--brand-ink);
            background: var(--white);
            transition: all 0.2s ease;
        }

        .grove-input::placeholder {
            color: rgba(111, 143, 159, 0.5);
        }

        .grove-input:focus {
            outline: none;
            border-color: var(--sage);
            box-shadow: 0 0 0 4px var(--sage-lt);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--brand-ink);
            border: none;
            border-radius: 12px;
            color: var(--white);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background: var(--sage);
            box-shadow: 0 4px 12px rgba(79, 121, 66, 0.15);
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.15);
            color: #DC2626;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        .divider {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px dashed var(--border);
            text-align: center;
            font-size: 11px;
            color: var(--brand-accent);
            letter-spacing: 0.3px;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            
            <div class="role-badge">
                <i class="bi bi-person-gear"></i> HR Panel Portal
            </div>

    <div class="brand-title">BuyBuzz Infra</div>
    <div class="brand-subtitle">System Access</div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert-error">
                        <i class="bi bi-exclamation-circle-fill"></i> {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="{% url 'login_view' %}">
                {% csrf_token %}
                
                <div class="grove-field">
                    <label class="grove-label">Phone Number</label>
                    <div class="input-icon-wrap">
                        <i class="bi bi-telephone"></i>
                        <input 
                            type="text" 
                            name="phone" 
                            class="grove-input" 
                            placeholder="Enter your registered number" 
                            required 
                            autofocus
                        >
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    Request Secure OTP <i class="bi bi-arrow-right"></i>
                </button>
            </form>

            <div class="divider">
                CoreCRM · Real Estate Infrastructure
            </div>
        </div>
    </div>

</body>
</html>
