<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP — BuyBreeze Manager</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        :root {
            --white: #ffffff;
            --cloud: #f7f3f0;
            --border: #e4e4e0;
            --ink: #2e2e2e;
            --stone: #6f8f9f;
            --sage: #4f7942;
            --sage-lt: #dce7d9;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--cloud);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 24px;
        }
        
        .auth-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 48px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
        }
        
        .brand-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--ink);
            text-align: center;
            margin-bottom: 8px;
        }
        
        .brand-subtitle {
            font-size: 11px;
            font-weight: 700;
            color: var(--stone);
            letter-spacing: 2.5px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 36px;
        }

        .grove-field { margin-bottom: 24px; }
        
        .grove-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--stone);
            margin-bottom: 8px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .grove-input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            font-size: 18px;
            color: var(--ink);
            text-align: center;
            font-family: 'Inter', monospace;
            letter-spacing: 8px;
            transition: all 0.2s;
        }
        
        .grove-input:focus {
            outline: none;
            border-color: var(--sage);
            box-shadow: 0 0 0 4px var(--sage-lt);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--ink);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover { background: var(--sage); }

        .alert {
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            margin-bottom: 20px;
            text-align: center;
        }

        .footer {
            margin-top: 32px;
            text-align: center;
            font-size: 11px;
            color: var(--stone);
            border-top: 1px dashed var(--border);
            padding-top: 24px;
        }
    </style>
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">
    
    <div class="brand-title">Secure Verification</div>
    <div class="brand-subtitle">Authentication gateway</div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert">
                <i class="bi bi-exclamation-circle"></i> {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="grove-field">
            <label class="grove-label">Enter 6-Digit Code</label>
            <input 
                type="text" 
                name="otp" 
                class="grove-input" 
                placeholder="000000" 
                maxlength="6"
                required 
                autofocus
                autocomplete="one-time-code"
            >
        </div>

        <button type="submit" class="btn-submit">
            <i class="bi bi-check-lg"></i> Confirm & Access
        </button>
    </form>
    
    <div class="footer">
        System Handshake · Encrypted Access
    </div>
    
  </div>
</div>

</body>
</html>
