<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Portal — BuyBreeze</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        :root {
            --white: #ffffff;
            --cloud: #f7f3f0;
            --border: #e4e4e0;
            --ink: #2e2e2e;
            --stone: #6f8f9f;
            --sage: #4f7942;
            --sage-lt: #dce7d9;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--cloud);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Abstract Subtle Background Elements */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
            z-index: 1;
        }

        .blob-1 { width: 600px; height: 600px; background: var(--sage); top: -200px; left: -200px; }
        .blob-2 { width: 400px; height: 400px; background: var(--stone); bottom: -100px; right: -100px; }

        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 24px;
        }

        .auth-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 48px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
        }

        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--sage-lt);
            color: var(--sage);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 24px;
        }

        .card-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 8px;
        }

        .card-subtitle {
            font-size: 14px;
            color: var(--stone);
            margin-bottom: 32px;
        }

        .grove-field { margin-bottom: 20px; }
        
        .grove-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--stone);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .grove-input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--ink);
            font-size: 15px;
            transition: all 0.2s;
        }

        .grove-input:focus {
            outline: none;
            border-color: var(--sage);
            box-shadow: 0 0 0 4px var(--sage-lt);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--ink);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
        }

        .btn-submit:hover { background: var(--sage); }

        .alert {
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            margin-bottom: 20px;
        }

        .footer {
            margin-top: 32px;
            text-align: center;
            font-size: 11px;
            color: var(--stone);
        }
    </style>
</head>

<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="login-wrapper">
        <div class="auth-card">
            <div class="role-badge">
                <i class="bi bi-person-workspace"></i> Manager Portal
            </div>

            <div class="card-title">Authentication</div>
            <div class="card-subtitle">Enter your registered phone number to receive OTP</div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert">
                        <i class="bi bi-exclamation-circle"></i> {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="{% url 'login_view' %}">
                {% csrf_token %}
                <div class="grove-field">
                    <label class="grove-label">Phone Number</label>
                    <input type="text" name="phone" class="grove-input" placeholder="+91 XXXXX XXXXX" required autofocus>
                </div>

                <button type="submit" class="btn-submit">
                    Send Authentication OTP <i class="bi bi-arrow-right"></i>
                </button>
            </form>

            <div class="footer">
                © 2026 BuyBreeze Infra · Enterprise Operations
            </div>
        </div>
    </div>

</body>
</html>
