<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Buy Buzz CRM</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        /* Grove Design Variables */
        :root {
            --white: #ffffff;
            --cloud: #f7f3f0;
            --border: #e4e4e0;
            --ink: #2e2e2e;
            --stone: #6f8f9f;
            --sage: #4f7942;
            --sage-lt: #dce7d9;
        }

        body {
            background-color: var(--cloud) !important;
            font-family: 'Geist', sans-serif;
            margin: 0;
            padding: 0;
        }

        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        
        .auth-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px 36px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.03), 0 4px 16px rgba(0, 0, 0, 0.01);
        }
        
        .brand-title {
            font-size: 32px;
            color: var(--ink);
            text-align: center;
            font-weight: 600;
        }
        
        .brand-subtitle {
            font-size: 11px;
            font-weight: 700;
            color: var(--stone);
            letter-spacing: 2.5px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 36px;
            margin-top: 4px;
        }
        
        .grove-field { margin-bottom: 24px; }
        
        .grove-label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--stone);
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }
        
        .grove-input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 11px 14px;
            font-size: 14px;
            color: var(--ink);
            background: var(--white);
            transition: all 0.2s ease;
        }
        
        .grove-input:focus {
            outline: none;
            border: 1.8px solid var(--sage);
            box-shadow: 0 0 0 4px var(--sage-lt);
        }

        .input-icon-wrapper { position: relative; }
        .input-icon-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--stone);
            font-size: 15px;
        }
        .input-icon-wrapper .grove-input { padding-left: 44px; }
        
        .btn-primary-sage {
            background: var(--sage);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .btn-primary-sage:hover { opacity: 0.9; color: white; }
        
        .auth-divider {
            font-size: 11px;
            color: var(--stone);
            text-align: center;
            margin-top: 36px;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-top: 1px dashed var(--border);
            padding-top: 24px;
        }
    </style>
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">
    
    <div class="brand-title">BuyBuzz Infra</div>
    <div class="brand-subtitle">System Access</div>

    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-danger" style="font-size: 13px; border-radius: 10px; margin-bottom: 20px;">
          <i class="bi bi-x-circle-fill"></i> {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <form method="POST" action="">
      {% csrf_token %}
      
      <div class="grove-field">
        <label class="grove-label">Phone Number Credentials</label>
        <div class="input-icon-wrapper">
          <i class="bi bi-telephone"></i>
          <input 
            type="text" 
            name="phone" 
            class="grove-input" 
            placeholder="Enter registered mobile number" 
            required 
            autofocus
          >
        </div>
      </div>

      <button type="submit" class="btn-primary-sage w-100 d-inline-flex align-items-center justify-content-center gap-2">
        <i class="bi bi-shield-check"></i> Sign In to CRM
      </button>
    </form>

    <div class="auth-divider">BuyBuzz Infra · Enterprise CRM Hub</div>
    
  </div>
</div>

</body>
</html>
